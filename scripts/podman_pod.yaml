    - name: control-plane
      image: docker.io/library/python:3.12-slim
      ports:
        - containerPort: 8090
          hostPort: 8090
      env:
        - {name: BUS, value: "redis"}
        - {name: REDIS_URL, value: "redis://127.0.0.1:6379/0"}
        - {name: PORT, value: "8090"}
        - {name: PYTHONPATH, value: "/app"}
        - {name: PYTHONUNBUFFERED, value: "1"}
      volumeMounts:
        - {name: repo, mountPath: /app, readOnly: true}
      workingDir: /app
      command:
        - sh
        - -c
        - "pip install --quiet --no-cache-dir -r requirements.txt && exec python -m services.control_plane.main"
  volumes:
    - name: repo
      hostPath:
        path: ..
        type: Directory
