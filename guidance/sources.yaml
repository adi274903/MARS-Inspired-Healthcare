# Curated guidance corpus: reporting guidelines, governance frameworks and the
# highly-cited evaluation papers that set the field's norms.
#
# Sourced from the user's own curated notes (tier list from memory, not a live
# citation ranking). Every entry carries the aliases that should trigger it, so the
# matcher stays deterministic. `url` points at the organisation's stable page; add
# `pmid`/`doi` only when you have verified them — an unverified identifier is worse
# than none, because the UI turns it into a clickable PubMed/DOI link.
#
# kind: reporting | governance | documentation | evaluation
sources:
  - id: tripod-ai
    kind: reporting
    name: "TRIPOD+AI"
    keys: [tripod, tripod+ai, prediction model reporting, prediction model, prognostic model, risk model]
    use_for: "Reporting of prediction-model development and validation"
    title: "TRIPOD+AI statement: updated guidance for reporting clinical prediction models that use regression or machine learning methods"
    authors: "Collins GS, et al."
    venue: "BMJ 385:e078378"
    year: 2024
    url: "https://www.equator-network.org/reporting-guidelines/tripod-statement/"
    pmid: "38626948"
    summary: "Extends TRIPOD (2015) to machine learning. The default reporting standard reviewers ask for on any clinical prediction model."

